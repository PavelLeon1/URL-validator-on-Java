# Название workflow, которое будет отображаться во вкладке Actions
name: Java CI with Gradle

# Триггер: запускать рабочий процесс при push в любую ветку
on: [push]

# Список "работ" или заданий, которые будут выполняться
jobs:
  # Название работы - "build-and-test"
  build-and-test:
    # Запускать на последней версии Ubuntu
    runs-on: ubuntu-latest

    # Стратегия "матрицы" для запуска на нескольких версиях Java
    strategy:
      # Не останавливать все сборки, если одна из них упала
      fail-fast: false
      matrix:
        # Указываем список версий Java, на которых нужно запустить сборку
        java: [ 11, 17, 21 ]

    # Шаги, которые будут выполнены для каждой версии Java из матрицы
    steps:
      # 1. Клонирование репозитория
      # Используем готовый action 'checkout' для загрузки кода
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Установка нужной версии JDK
      # Используем action 'setup-java' для установки Java
      # Версия Java будет подставлена из матрицы (11, 17 или 21)
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin' # Популярный и надежный дистрибутив Java

      # 3. Предоставление прав на выполнение для Gradle Wrapper
      # Это необходимо, чтобы система могла запустить скрипт сборки
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 4. Запуск статического анализа Checkstyle
      # Эта команда запускает задачу checkstyleMain, которая проверяет код
      # на соответствие правилам (в вашем случае - наличие JavaDoc).
      # Если проверка не пройдет, сборка упадет с ошибкой.
      - name: Run Checkstyle
        run: ./gradlew checkstyleMain

      # 5. Сборка проекта и запуск тестов
      # Команда 'build' компилирует код, запускает тесты и собирает JAR-файл.
      # Она автоматически зависит от 'check', поэтому тесты тоже запустятся.
      - name: Build with Gradle
        run: ./gradlew build